name: Heroes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: heroes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Pillow
        run: python3 -m pip install pillow==11.3.0

      - name: Generate heroes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: python3 scripts/gen_heroes.py

      - name: Commit new heroes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data/hero_placeholders.json
          if git diff --cached --quiet; then
            echo "No new hero images."
            exit 0
          fi
          git commit -m "chore(heroes): add generated images"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
