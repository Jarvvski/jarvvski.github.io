{% extends "base.html" %}

{% block content %}
<div class="column">
  <h1>Tags</h1>
  <ul class="tag-index">
    {% for term in terms %}
      <li>
        <a href="{{ term.permalink }}">{{ term.name }}</a>
        <span>{{ term.page_count }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
